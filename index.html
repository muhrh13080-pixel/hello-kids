<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Kids</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-pink: #ff6b81;
            --light-pink: #ffEEf2;
            --bg-color: #f8f9fa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 10px 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-center {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-btn, .cart-btn, .lang-btn {
            background: var(--light-pink);
            border: none;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: var(--primary-pink);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .lang-select {
            background: var(--light-pink);
            border: none;
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-pink);
            cursor: pointer;
            outline: none;
        }
        .logo-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-pink);
            margin: 0;
        }
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }
        .cat-btn {
            background: #e9ecef;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #495057;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }
        .cat-btn.active {
            background: var(--primary-pink);
            color: white;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-img {
            width: 100%;
            height: 120px;
            background: #f1f3f5;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #adb5bd;
            font-size: 12px;
            margin-bottom: 8px;
            object-fit: cover;
        }
        .product-title {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 4px 0;
        }
        .product-price {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary-pink);
            margin: 0;
        }
        .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .badge.in-stock { background: #e6fcf5; color: #0ca678; }
        .badge.out-stock { background: #fff5f5; color: #fa5252; }
        
        /* Модальное окно профиля */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 14px;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .modal-content h3 { margin-top: 0; color: var(--primary-pink); }
        .modal-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            margin-bottom: 12px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .modal-btn {
            width: 100%;
            background: var(--primary-pink);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <!-- Слева: Профиль с кнопкой ввода номера -->
        <div class="header-left">
            <button class="profile-btn" onclick="openProfileModal()">👤 <span id="profileName">Профиль</span></button>
        </div>

        <!-- По центру: Логотип и переключатель языков -->
        <div class="header-center">
            <h1 class="logo-title">👶 Hello Kids</h1>
            <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
                <option value="ru">Рус</option>
                <option value="en">Eng</option>
                <option value="tj">Тоҷ</option>
            </select>
        </div>

        <!-- Справа: Корзина -->
        <div class="header-right">
            <button class="cart-btn" onclick="openCart()">🛒 <span id="cartCount">0</span></button>
        </div>
    </div>

    <!-- Категории -->
    <div class="categories" id="categoryContainer">
        <button class="cat-btn active" onclick="filterCategory('all', this)" data-cat="all">🔥 Все</button>
        <button class="cat-btn" onclick="filterCategory('boys', this)" data-cat="boys">👦 Мальчикам</button>
        <button class="cat-btn" onclick="filterCategory('girls', this)" data-cat="girls">👧 Девочкам</button>
    </div>

    <!-- Список товаров -->
    <div class="products-grid" id="productsGrid">
        <!-- Товары -->
        <div class="product-card" data-category="boys">
            <span class="badge in-stock">В наличии</span>
            <div class="product-img">Фото</div>
            <h3 class="product-title">Костюм детский</h3>
            <p class="product-price">120 сом.</p>
        </div>
        <div class="product-card" data-category="girls">
            <span class="badge out-stock">Нет в наличии</span>
            <div class="product-img">Фото</div>
            <h3 class="product-title">Платье для девочки</h3>
            <p class="product-price">80 сом.</p>
        </div>
    </div>

    <!-- Модальное окно ввода телефона -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <h3 id="modalTitle">Ваши данные</h3>
            <p style="font-size: 13px; color: #666;" id="modalDesc">Введите ваше имя и номер телефона для заказа:</p>
            <input type="text" id="userNameInput" class="modal-input" placeholder="Ваше имя">
            <input type="tel" id="userPhoneInput" class="modal-input" placeholder="+992 XX XXX XX XX">
            <button class="modal-btn" onclick="saveProfile()" id="modalSaveBtn">Сохранить</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const translations = {
            ru: { profile: "Профиль", all: "🔥 Все", boys: "👦 Мальчикам", girls: "👧 Девочкам", inStock: "В наличии", outStock: "Нет в наличии", modalTitle: "Ваши данные", modalDesc: "Введите ваше имя и номер телефона для заказа:", save: "Сохранить" },
            en: { profile: "Profile", all: "🔥 All", boys: "👦 Boys", girls: "👧 Girls", inStock: "In stock", outStock: "Out of stock", modalTitle: "Your Details", modalDesc: "Enter your name and phone number for the order:", save: "Save" },
            tj: { profile: "Профил", all: "🔥 Ҳама", boys: "👦 Барои писарон", girls: "👧 Барои духтарон", inStock: "Дар омбори", outStock: "Нест", modalTitle: "Маълумоти шумо", modalDesc: "Ном ва рақами телефони худро ворид кунед:", save: "Захира" }
        };

        function changeLanguage(lang) {
            document.getElementById('profileName').innerText = translations[lang].profile;
            document.querySelector('[data-cat="all"]').innerText = translations[lang].all;
            document.querySelector('[data-cat="boys"]').innerText = translations[lang].boys;
            document.querySelector('[data-cat="girls"]').innerText = translations[lang].girls;
            document.getElementById('modalTitle').innerText = translations[lang].modalTitle;
            document.getElementById('modalDesc').innerText = translations[lang].modalDesc;
            document.getElementById('modalSaveBtn').innerText = translations[lang].save;
        }

        function openProfileModal() {
            document.getElementById('profileModal').style.display = 'flex';
        }

        function saveProfile() {
            const name = document.getElementById('userNameInput').value;
            const phone = document.getElementById('userPhoneInput').value;
            if(name) {
                document.getElementById('profileName').innerText = name;
            }
            document.getElementById('profileModal').style.display = 'none';
        }

        function filterCategory(category, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            document.querySelectorAll('.product-card').forEach(card => {
                if(category === 'all' || card.dataset.category === category) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function openCart() {
            alert('Корзина пока пуста');
        }
    </script>
</body>
</html>
