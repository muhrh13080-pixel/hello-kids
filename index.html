<!-- Боковое меню (Drawer) -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-user">
            <img src="https://via.placeholder.com/50" alt="Avatar" id="sidebarAvatar">
            <div>
                <h4 id="sidebarName">Имя пользователя</h4>
                <p id="sidebarUsername">@username</p>
            </div>
        </div>
        <button class="close-sidebar" onclick="toggleSidebar()">&times;</button>
    </div>

    <div class="sidebar-menu">
        <a href="#" class="menu-item active" onclick="toggleSidebar()">
            <span class="icon">🏠</span>
            <div>
                <span class="title">Главная</span>
                <span class="desc">Каталог товаров</span>
            </div>
        </a>
        <a href="#" class="menu-item" onclick="openCart(); toggleSidebar();">
            <span class="icon">🛒</span>
            <div>
                <span class="title">Корзина</span>
                <span class="desc">Ваши выбранные вещи</span>
            </div>
        </a>
        <a href="#" class="menu-item" onclick="toggleSidebar()">
            <span class="icon">📦</span>
            <div>
                <span class="title">Мои заказы</span>
                <span class="desc">История покупок</span>
            </div>
        </a>
        <a href="#" class="menu-item" onclick="toggleSidebar()">
            <span class="icon">📞</span>
            <div>
                <span class="title">Контакты</span>
                <span class="desc">Связь с нами</span>
            </div>
        </a>
    </div>
</div>
