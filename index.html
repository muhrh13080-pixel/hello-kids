<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Kids - Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-color: #2b2b2b;
            --primary-pink: #ff6584;
            --primary-blue: #4a90e2;
            --accent-gradient: linear-gradient(135deg, #4a90e2 0%, #ff6584 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            padding-bottom: 70px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .menu-toggle {
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--primary-blue);
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-icons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .cart-icon-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            position: relative;
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -8px;
            background: var(--primary-pink);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
        }

        /* Выдвижное меню (три полосы) */
        #side-menu {
            position: fixed;
            top: 0; left: -280px; width: 260px; height: 100%;
            background: white;
            z-index: 200;
            box-shadow: 5px 0 15px rgba(0,0,0,0.1);
            transition: 0.3s;
            padding: 20px;
            box-sizing: border-box;
        }

        #side-menu.open {
            left: 0;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 18px;
        }

        .menu-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        .menu-section-title {
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .lang-options {
            display: flex;
            gap: 5px;
            margin-bottom: 25px;
        }

        .lang-btn {
            flex: 1;
            padding: 8px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .lang-btn.active {
            border-color: var(--primary-blue);
            color: var(--primary-blue);
            background: #f0f7ff;
        }

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 5px;
        }

        .cat-btn {
            background: white;
            border: 2px solid var(--primary-pink);
            color: var(--primary-pink);
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px solid #eee;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        .product-card:hover {
            border-color: var(--primary-pink);
        }

        .status-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: bold;
        }
        .status-in { background: #e6fcf5; color: #0ca678; }
        .status-out { background: #fff5f5; color: #fa5252; }

        .add-card {
            border: 2px dashed var(--primary-pink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff0f3;
            min-height: 180px;
            text-align: center;
        }

        .add-icon { font-size: 32px; color: var(--primary-pink); margin-bottom: 5px; }
        .add-text { font-size: 13px; font-weight: bold; color: var(--primary-pink); }

        .product-img {
            width: 100%;
            height: 110px;
            background: #ffe0eb;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-pink);
            font-weight: bold;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .product-img img { width: 100%; height: 100%; object-fit: cover; }

        .product-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-info { font-size: 11px; color: #888; margin-bottom: 5px; }
        .product-price { font-size: 13px; color: #666; }
        .old-price { text-decoration: line-through; font-size: 11px; color: #999; margin-right: 5px; }
        .new-price { color: var(--primary-pink); font-weight: bold; font-size: 15px; }

        /* Модальные окна */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 300;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 85%;
            max-width: 350px;
            max-height: 90vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .modal-content h3 { margin-top: 0; }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            background: white;
            font-family: inherit;
        }

        .file-upload-label {
            display: block;
            background: #f1f3f5;
            border: 2px dashed #cbd5e1;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #475569;
            margin-bottom: 10px;
        }
        #m-photo-input { display: none; }

        .modal-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-save { background: var(--accent-gradient); color: white; }
        .btn-delete { background: #ff4757; color: white; display: none; }
        .btn-cancel { background: #eee; color: #666; }

        .client-modal-img {
            width: 100%;
            height: 180px;
            border-radius: 10px;
            background: #ffe0eb;
            object-fit: cover;
            margin-bottom: 10px;
        }
        .desc-text { font-size: 13px; color: #555; margin-bottom: 15px; line-height: 1.4; }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding: 8px 0;
            font-size: 13px;
        }
        .cart-total {
            font-weight: bold;
            font-size: 16px;
            margin: 15px 0;
            text-align: right;
        }
    </style>
</head>
<body>

    <header>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <div class="logo">👶 Hello Kids</div>
        <div class="header-icons">
            <button class="cart-icon-btn" onclick="openCartModal()">🛒<span class="cart-badge" id="cart-count">0</span></button>
        </div>
    </header>

    <!-- Выдвижное меню (три полосы) -->
    <div id="side-menu">
        <div class="menu-header">
            <span id="menu-title-text">Меню</span>
            <button class="menu-close" onclick="toggleMenu()">✕</button>
        </div>
        <div class="menu-section-title" id="lang-title">Язык / Language / Забон</div>
        <div class="lang-options">
            <button class="lang-btn active" onclick="setLang('ru')">RU</button>
            <button class="lang-btn" onclick="setLang('tj')">TJ</button>
            <button class="lang-btn" onclick="setLang('en')">EN</button>
        </div>
    </div>

    <!-- Категории -->
    <div class="categories">
        <button class="cat-btn active" onclick="filterCat('all', this)" id="cat-all">🔥 Все</button>
        <button class="cat-btn" onclick="filterCat('boys', this)" id="cat-boys">👦 Мальчикам</button>
        <button class="cat-btn" onclick="filterCat('girls', this)" id="cat-girls">👧 Девочкам</button>
        <button class="cat-btn" onclick="filterCat('toys', this)" id="cat-toys">🧸 Игрушки</button>
        <button class="cat-btn" onclick="filterCat('shoes', this)" id="cat-shoes">👟 Обувь</button>
    </div>

    <div class="products-grid" id="product-list"></div>

    <!-- Модальное окно Админки -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title-text">➕ Товар</h3>
            <input type="hidden" id="m-id">
            <input type="text" id="m-name" placeholder="Название товара">
            
            <select id="m-category">
                <option value="boys">Мальчикам</option>
                <option value="girls">Девочкам</option>
                <option value="toys">Игрушки</option>
                <option value="shoes">Обувь</option>
            </select>

            <select id="m-size">
                <option value="Без размера">Универсальный / Без размера</option>
                <option value="90 см">90 см</option>
                <option value="100 см">100 см</option>
                <option value="110 см">110 см</option>
                <option value="120 см">120 см</option>
                <option value="130 см">130 см</option>
                <option value="140 см">140 см</option>
                <option value="150 см">150 см</option>
                <option value="160 см">160 см</option>
            </select>

            <input type="number" id="m-price" placeholder="Цена (сомони)">
            <input type="number" id="m-sale" placeholder="Цена со скидкой (опционально)">
            
            <textarea id="m-desc" placeholder="Описание товара..." rows="3"></textarea>

            <label style="font-size: 12px; font-weight: bold; color: #666; display: flex; align-items: center; gap: 8px; margin-bottom: 10px;">
                <input type="checkbox" id="m-in-stock" checked style="width: auto; margin: 0;"> <span id="lbl-stock-check">Товар в наличии</span>
            </label>

            <label class="file-upload-label" for="m-photo-input" id="lbl-photo">📷 Выбрать фото</label>
            <input type="file" id="m-photo-input" accept="image/*" onchange="previewImage(event)">

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()" id="btn-cancel-modal">Отмена</button>
                <button class="btn-delete" id="del-btn" onclick="deleteProduct()">Удалить</button>
                <button class="btn-save" onclick="saveProduct()" id="btn-save-modal">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно просмотра товара клиентом -->
    <div id="client-modal" class="modal">
        <div class="modal-content">
            <div id="c-modal-body"></div>
            <div class="modal-buttons" style="margin-top: 15px;">
                <button class="btn-cancel" onclick="closeClientModal()" id="btn-close-client">Закрыть</button>
                <button class="btn-save" id="btn-add-cart" onclick="addToCart()">В корзину</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно Корзины -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <h3 id="cart-modal-title">🛒 Корзина</h3>
            <div id="cart-items-container"></div>
            <div class="cart-total" id="cart-total-text">Итого: 0 сомони</div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeCartModal()" id="btn-close-cart">Закрыть</button>
                <button class="btn-save" onclick="checkout()" id="btn-checkout">Оформить заказ</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentLang = 'ru';
        const translations = {
            ru: {
                menu: "Меню",
                langTitle: "Язык / Language / Забон",
                all: "🔥 Все", boys: "👦 Мальчикам", girls: "👧 Девочкам", toys: "🧸 Игрушки", shoes: "👟 Обувь",
                add: "Добавить товар", inStock: "В наличии", outStock: "Нет в наличии",
                cart: "🛒 Корзина", total: "Итого", order: "Оформить заказ",
                close: "Закрыть", cancel: "Отмена", save: "Сохранить", delete: "Удалить",
                addToCartBtn: "В корзину",
                sizeLabel: "Размер:", statusLabel: "Статус:", descDefault: "Описание отсутствует",
                cartEmpty: "Корзина пуста", addedAlert: "Товар добавлен в корзину!", orderSuccess: "Спасибо за заказ! Заказ отправлен.",
                fillError: "Заполните название и цену!", addModalTitle: "➕ Добавить товар", photoLabel: "📷 Выбрать фото", stockCheck: "Товар в наличии"
            },
            tj: {
                menu: "Меню",
                langTitle: "Забон / Language / Язык",
                all: "🔥 Ҳама", boys: "👦 Бачагона", girls: "👧 Духтарона", toys: "🧸 Бозичаҳо", shoes: "👟 Пойафзол",
                add: "Илова кардани мол", inStock: "Дар омбор ҳаст", outStock: "Нест",
                cart: "🛒 Саватча", total: "Ҳамагӣ", order: "Фармоиш додан",
                close: "Пушидан", cancel: "Бекор кардан", save: "Нигоҳ доштан", delete: "Нест кардан",
                addToCartBtn: "Ба саватча",
                sizeLabel: "Андоза:", statusLabel: "Ҳолат:", descDefault: "Тавсиф мавҷуд нест",
                cartEmpty: "Саватча холӣ аст", addedAlert: "Мол ба саватча илова шуд!", orderSuccess: "Ташаккур барои фармоиш! Фармоиш фиристода шуд.",
                fillError: "Ном ва нархро пур кунед!", addModalTitle: "➕ Илова кардани мол", photoLabel: "📷 Интихоби акс", stockCheck: "Мол дар омбор ҳаст"
            },
            en: {
                menu: "Menu",
                langTitle: "Language / Забон / Язык",
                all: "🔥 All", boys: "👦 Boys", girls: "Girls", toys: "🧸 Toys", shoes: "👟 Shoes",
                add: "Add product", inStock: "In stock", outStock: "Out of stock",
                cart: "🛒 Cart", total: "Total", order: "Checkout",
                close: "Close", cancel: "Cancel", save: "Save", delete: "Delete",
                addToCartBtn: "Add to cart",
                sizeLabel: "Size:", statusLabel: "Status:", descDefault: "No description available",
                cartEmpty: "Cart is empty", addedAlert: "Product added to cart!", orderSuccess: "Thank you for your order! Order sent.",
                fillError: "Fill in name and price!", addModalTitle: "➕ Add Product", photoLabel: "📷 Choose Photo", stockCheck: "In stock"
            }
        };

        const defaultProducts = [
            { id: 1, name: "Костюм детский", category: "boys", size: "110 см", price: 120, salePrice: "", photo: "", desc: "Красивый удобный костюм для ребенка", inStock: true },
            { id: 2, name: "Платье для девочки", category: "girls", size: "100 см", price: 95, salePrice: 80, photo: "", desc: "Нарядное платье", inStock: false }
        ];

        let products = JSON.parse(localStorage.getItem('hellokids_products')) || defaultProducts;
        let cart = JSON.parse(localStorage.getItem('hellokids_cart')) || [];
        let currentFilter = 'all';
        let currentImageBase64 = "";
        let selectedProductForCart = null;

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            
            // Обновляем текст всех элементов интерфейса на выбранный язык
            document.getElementById('menu-title-text').innerText = translations[lang].menu;
            document.getElementById('lang-title').innerText = translations[lang].langTitle;
            document.getElementById('cat-all').innerText = translations[lang].all;
            document.getElementById('cat-boys').innerText = translations[lang].boys;
            document.getElementById('cat-girls').innerText = translations[lang].girls;
            document.getElementById('cat-toys').innerText = translations[lang].toys;
            document.getElementById('cat-shoes').innerText = translations[lang].shoes;
            document.getElementById('cart-modal-title').innerText = translations[lang].cart;
            document.getElementById('btn-close-cart').innerText = translations[lang].close;
            document.getElementById('btn-checkout').innerText = translations[lang].order;
            document.getElementById('btn-close-client').innerText = translations[lang].close;
            document.getElementById('btn-add-cart').innerText = translations[lang].addToCartBtn;
            document.getElementById('btn-cancel-modal').innerText = translations[lang].cancel;
            document.getElementById('btn-save-modal').innerText = translations[lang].save;
            document.getElementById('lbl-stock-check').innerText = translations[lang].stockCheck;
            document.getElementById('lbl-photo').innerText = translations[lang].photoLabel;
            
            toggleMenu();
            renderProducts(currentFilter);
        }

        function toggleMenu() {
            document.getElementById('side-menu').classList.toggle('open');
        }

        function renderProducts(filter = 'all') {
            currentFilter = filter;
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            
            const filteredProducts = filter === 'all' ? products : products.filter(p => p.category === filter);

            filteredProducts.forEach(p => {
                let priceHTML = `<span>${p.price} сом.</span>`;
                if (p.salePrice) {
                    priceHTML = `<span class="old-price">${p.price} сом.</span><span class="new-price">${p.salePrice} сом.</span>`;
                }

                let imgHTML = p.photo ? `<img src="${p.photo}" alt="product">` : `📷 Фото`;
                let stockBadge = p.inStock 
                    ? `<span class="status-badge status-in">${translations[currentLang].inStock}</span>` 
                    : `<span class="status-badge status-out">${translations[currentLang].outStock}</span>`;

                list.innerHTML += `
                    <div class="product-card" onclick="openClientOrEdit(${p.id})">
                        ${stockBadge}
                        <div class="product-img">${imgHTML}</div>
                        <div class="product-title">${p.name}</div>
                        <div class="product-info">Размер: ${p.size || 'Универсальный'}</div>
                        <div class="product-price">${priceHTML}</div>
                    </div>
                `;
            });

            list.innerHTML += `
                <div class="product-card add-card" onclick="openAddModal()">
                    <div class="add-icon">+</div>
                    <div class="add-text">${translations[currentLang].add}</div>
                </div>
            `;
            updateCartCount();
        }

        function openClientOrEdit(id) {
            const p = products.find(item => item.id === id);
            if (!p) return;
            selectedProductForCart = p;

            let imgHTML = p.photo ? `<img src="${p.photo}" class="client-modal-img">` : '';
            let priceVal = p.salePrice ? p.salePrice : p.price;
            let stockStatusText = p.inStock ? translations[currentLang].inStock : translations[currentLang].outStock;
            
            document.getElementById('c-modal-body').innerHTML = `
                ${imgHTML}
                <h3>${p.name}</h3>
                <p class="desc-text">${p.desc || translations[currentLang].descDefault}</p>
                <div style="font-size: 13px; color: #666; margin-bottom: 5px;">${translations[currentLang].sizeLabel} <b>${p.size}</b></div>
                <div style="font-size: 13px; color: #666; margin-bottom: 10px;">${translations[currentLang].statusLabel} <b>${stockStatusText}</b></div>
                <div style="font-size: 18px; font-weight: bold; color: var(--primary-pink);">${priceVal} сомони</div>
            `;
            
            const btnAdd = document.getElementById('btn-add-cart');
            if (p.inStock) {
                btnAdd.style.display = 'block';
            } else {
                btnAdd.style.display = 'none';
            }

            document.getElementById('client-modal').style.display = 'flex';
        }

        function closeClientModal() {
            document.getElementById('client-modal').style.display = 'none';
        }

        function openAddModal() {
            document.getElementById('modal-title-text').innerText = translations[currentLang].addModalTitle;
            document.getElementById('m-id').value = '';
            document.getElementById('m-name').value = '';
            document.getElementById('m-category').value = currentFilter === 'all' ? 'boys' : currentFilter;
            document.getElementById('m-size').value = '110 см';
            document.getElementById('m-price').value = '';
            document.getElementById('m-sale').value = '';
            document.getElementById('m-desc').value = '';
            document.getElementById('m-in-stock').checked = true;
            currentImageBase64 = "";
            document.getElementById('m-photo-input').value = '';
            document.getElementById('del-btn').style.display = 'none';
            document.getElementById('modal').style.display = 'flex';
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400;
                    const MAX_HEIGHT = 400;
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    currentImageBase64 = canvas.toDataURL('image/jpeg', 0.6);
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function saveProduct() {
            const id = document.getElementById('m-id').value;
            const name = document.getElementById('m-name').value;
            const category = document.getElementById('m-category').value;
            const size = document.getElementById('m-size').value;
            const price = document.getElementById('m-price').value;
            const salePrice = document.getElementById('m-sale').value;
            const desc = document.getElementById('m-desc').value;
            const inStock = document.getElementById('m-in-stock').checked;

            if (!name || !price) { alert(translations[currentLang].fillError); return; }

            let existingProduct = products.find(item => item.id == id);
            let photoToSave = currentImageBase64 || (existingProduct ? existingProduct.photo : "");

            const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
            products.push({
                id: newId,
                name, category, size,
                price: Number(price),
                salePrice: salePrice ? Number(salePrice) : "",
                desc, inStock,
                photo: photoToSave
            });

            localStorage.setItem('hellokids_products', JSON.stringify(products));
            closeModal();
            renderProducts(currentFilter);
        }

        function deleteProduct() {
            const id = document.getElementById('m-id').value;
            if (!id) return;
            products = products.filter(p => p.id != id);
            localStorage.setItem('hellokids_products', JSON.stringify(products));
            closeModal();
            renderProducts(currentFilter);
        }

        function addToCart() {
            if (!selectedProductForCart) return;
            cart.push(selectedProductForCart);
            localStorage.setItem('hellokids_cart', JSON.stringify(cart));
            updateCartCount();
            closeClientModal();
            alert(translations[currentLang].addedAlert);
        }

        function updateCartCount() {
            document.getElementById('cart-count').innerText = cart.length;
        }

        function openCartModal() {
            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';
            if (cart.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#888;">${translations[currentLang].cartEmpty}</p>`;
                document.getElementById('cart-total-text').innerText = `${translations[currentLang].total}: 0 сомони`;
                document.getElementById('cart-modal').style.display = 'flex';
                return;
            }

            let total = 0;
            cart.forEach((item, index) => {
                let price = item.salePrice ? item.salePrice : item.price;
                total += price;
                container.innerHTML += `
                    <div class="cart-item">
                        <div><b>${item.name}</b><br><small>${translations[currentLang].sizeLabel} ${item.size}</small></div>
                        <div>${price} сом. <button onclick="removeFromCart(${index})" style="background:none;border:none;color:red;cursor:pointer;font-size:16px;">🗑</button></div>
                    </div>
                `;
            });
            document.getElementById('cart-total-text').innerText = `${translations[currentLang].total}: ${total} сомони`;
            document.getElementById('cart-modal').style.display = 'flex';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem('hellokids_cart', JSON.stringify(cart));
            openCartModal();
            updateCartCount();
        }

        function closeCartModal() { document.getElementById('cart-modal').style.display = 'none'; }

        function checkout() {
            if (cart.length === 0) { alert(translations[currentLang].cartEmpty); return; }
            alert(translations[currentLang].orderSuccess);
            cart = [];
            localStorage.removeItem('hellokids_cart');
            updateCartCount();
            closeCartModal();
        }

        function filterCat(category, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts(category);
        }

        renderProducts();
    </script>
</body>
</html>
