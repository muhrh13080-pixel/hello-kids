<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Kids</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-pink: #ff6b81;
            --light-pink: #ffeef2;
            --bg-color: #f8f9fa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .menu-btn, .cart-btn, .profile-header-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            position: relative;
        }
        .header-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-pink);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--primary-pink);
            color: white;
            font-size: 11px;
            padding: 2px 5px;
            border-radius: 50%;
        }
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }
        .cat-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 8px 15px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 14px;
        }
        .cat-btn.active {
            background: var(--primary-pink);
            color: white;
            border-color: var(--primary-pink);
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: relative;
            cursor: pointer;
        }
        .product-img {
            width: 100%;
            height: 120px;
            background: var(--light-pink);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 14px;
            overflow: hidden;
        }
        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-title {
            font-size: 14px;
            font-weight: bold;
            margin: 8px 0 4px;
        }
        .product-info {
            font-size: 12px;
            color: #666;
        }
        .product-price {
            font-size: 14px;
            font-weight: bold;
            color: var(--primary-pink);
            margin-top: 5px;
        }
        .old-price {
            text-decoration: line-through;
            color: #999;
            font-size: 12px;
            margin-right: 5px;
        }
        .status-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 6px;
            font-weight: bold;
        }
        .status-in { background: #e1f5fe; color: #0288d1; }
        .status-out { background: #ffebee; color: #c62828; }
        
        .add-card {
            border: 2px dashed var(--primary-pink);
            background: var(--light-pink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 180px;
        }
        .add-icon { font-size: 28px; color: var(--primary-pink); }
        .add-text { font-size: 13px; color: var(--primary-pink); font-weight: bold; margin-top: 5px; }

        /* Боковое меню */
        .side-menu {
            position: fixed;
            top: 0; left: -250px;
            width: 250px; height: 100%;
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            transition: 0.3s;
            z-index: 100;
            padding: 20px;
            box-sizing: border-box;
        }
        .side-menu.open { left: 0; }
        .side-menu h3 { margin-top: 0; color: var(--primary-pink); }
        .side-menu div.menu-item-link {
            display: block;
            padding: 10px 0;
            color: #333;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        /* Модальные окна */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white; padding: 20px; border-radius: 15px; width: 90%; max-width: 320px;
            box-sizing: border-box;
        }
        .modal-content h3 { margin-top: 0; }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box;
        }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .modal-buttons button { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-save { background: var(--primary-pink); color: white; }
        .btn-cancel { background: #ddd; color: #333; }
        
        .client-modal-img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; font-size: 13px; }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div class="logo">👶 Hello Kids</div>
        <div class="header-right">
            <button class="profile-header-btn" onclick="openProfileModal()" title="Профиль">👤</button>
            <button class="cart-btn" onclick="openCartModal()">🛒<span class="cart-badge" id="cart-count">0</span></button>
        </div>
    </div>

    <!-- Категории -->
    <div class="categories">
        <button class="cat-btn active" id="cat-all" onclick="filterCat('all', this)">🔥 Все</button>
        <button class="cat-btn" id="cat-boys" onclick="filterCat('boys', this)">👦 Мальчикам</button>
        <button class="cat-btn" id="cat-girls" onclick="filterCat('girls', this)">👧 Девочкам</button>
        <button class="cat-btn" id="cat-toys" onclick="filterCat('toys', this)">🧸 Игрушки</button>
        <button class="cat-btn" id="cat-shoes" onclick="filterCat('shoes', this)">👟 Обувь</button>
    </div>

    <!-- Сетка товаров -->
    <div class="product-grid" id="product-list"></div>

    <!-- Боковое меню -->
    <div class="side-menu" id="side-menu">
        <h3 id="menu-title-text">Меню</h3>
        
        <!-- Кнопка профиля в меню -->
        <div class="menu-item-link" id="menu-profile-text" onclick="openProfileModal()">👤 Профиль</div>

        <div style="margin-top: 20px;">
            <p id="lang-title" style="font-size: 13px; color: #666; margin-bottom: 5px;">Язык / Language</p>
            <button class="cat-btn lang-btn active" onclick="setLang('ru')">Русский</button>
            <button class="cat-btn lang-btn" onclick="setLang('tj')">Тоҷикӣ</button>
            <button class="cat-btn lang-btn" onclick="setLang('en')">English</button>
        </div>
        <div class="menu-item-link" onclick="toggleMenu()" style="margin-top: 30px; color: var(--primary-pink); text-align: center; border: none;" id="menu-close-text">✕ Закрыть</div>
    </div>

    <!-- Модальное окно Профиль -->
    <div id="profile-modal" class="modal">
        <div class="modal-content" style="text-align: left;">
            <h3 style="text-align: center;" id="prof-title">👤 Мой профиль</h3>
            
            <div style="margin: 12px 0; font-size: 14px;">
                <span style="color: #666; display: block; font-size: 12px;" id="prof-user-label">Юзер / Имя и Telegram ID:</span>
                <b id="profile-user-info" style="font-size: 15px; color: #000;">—</b>
            </div>

            <div style="margin: 12px 0 20px 0; font-size: 14px;">
                <span style="color: #666; display: block; font-size: 12px;" id="prof-phone-label">Номер телефона:</span>
                <div id="phone-container">
                    <button onclick="requestContact()" id="btn-share-phone" style="width: 100%; padding: 8px; background: #e1f5fe; color: #0288d1; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; margin-top: 4px;">📱 Поделиться номером</button>
                </div>
            </div>

            <div id="admin-action-container" style="text-align: center; margin-bottom: 10px;"></div>
            
            <button onclick="closeProfileModal()" id="prof-close-btn" style="width:100%; padding:10px; background:#ddd; border:none; border-radius:8px; cursor:pointer;">Закрыть</button>
        </div>
    </div>

    <!-- Модальное окно добавления/редактирования товара -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title-text">➕ Добавить товар</h3>
            <input type="hidden" id="m-id">
            <input type="text" id="m-name" placeholder="Название товара">
            <select id="m-category">
                <option value="boys">Мальчикам</option>
                <option value="girls">Девочкам</option>
                <option value="toys">Игрушки</option>
                <option value="shoes">Обувь</option>
            </select>
            <input type="text" id="m-size" placeholder="Размер (например: 110 см)">
            <input type="number" id="m-price" placeholder="Цена (сом.)">
            <input type="number" id="m-sale" placeholder="Цена со скидкой (необязательно)">
            <textarea id="m-desc" placeholder="Описание товара"></textarea>
            
            <label style="display:flex; align-items:center; gap:8px; font-size:14px; margin: 10px 0;">
                <input type="checkbox" id="m-in-stock" checked> <span id="lbl-stock-check">Товар в наличии</span>
            </label>

            <label id="lbl-photo" style="display:block; background:var(--light-pink); color:var(--primary-pink); padding:8px; text-align:center; border-radius:8px; cursor:pointer; font-size:13px; font-weight:bold; margin-bottom: 10px;">
                📷 Выбрать фото <input type="file" id="m-photo-input" accept="image/*" style="display:none;" onchange="previewImage(event)">
            </label>

            <div class="modal-buttons">
                <button class="btn-cancel" id="btn-cancel-modal" onclick="closeModal()">Отмена</button>
                <button class="btn-save" id="btn-save-modal" onclick="saveProduct()">Сохранить</button>
            </div>
            <button id="del-btn" onclick="deleteProduct()" style="width:100%; background:#ff4444; color:white; border:none; border-radius:8px; padding:8px; margin-top:8px; display:none; cursor:pointer;">Удалить товар</button>
        </div>
    </div>

    <!-- Модальное окно клиента -->
    <div id="client-modal" class="modal">
        <div class="modal-content">
            <div id="c-modal-body"></div>
            <div class="modal-buttons" style="margin-top: 15px;">
                <button class="btn-cancel" id="btn-close-client" onclick="closeClientModal()">Закрыть</button>
                <button class="btn-save" id="btn-add-cart" onclick="addToCart()">В корзину</button>
            </div>
        </div>
    </div>

    <!-- Корзина -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <h3 id="cart-modal-title">🛒 Корзина</h3>
            <div id="cart-items-container" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px;"></div>
            <div id="cart-total-text" style="font-weight: bold; margin-bottom: 15px; font-size: 15px;">Итого: 0 сомони</div>
            <div class="modal-buttons">
                <button class="btn-cancel" id="btn-close-cart" onclick="closeCartModal()">Закрыть</button>
                <button class="btn-save" id="btn-checkout" onclick="checkout()">Оформить заказ</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const ADMIN_ID = 5429076224;

        function isAdmin() {
            const userId = tg.initDataUnsafe?.user?.id;
            if (userId && Number(userId) === ADMIN_ID) {
                return true;
            }
            if (localStorage.getItem('hellokids_is_admin') === 'true') {
                return true;
            }
            return false;
        }

        let currentLang = 'ru';
        const translations = {
            ru: {
                menu: "Меню", langTitle: "Язык / Language / Забон", profileMenu: "👤 Профиль", closeMenu: "✕ Закрыть",
                profTitle: "👤 Мой профиль", profUserLabel: "Юзер / Имя и Telegram ID:", profPhoneLabel: "Номер телефона:",
                sharePhone: "📱 Поделиться номером", profClose: "Закрыть",
                all: "🔥 Все", boys: "👦 Мальчикам", girls: "👧 Девочкам", toys: "🧸 Игрушки", shoes: "👟 Обувь",
                add: "Добавить товар", inStock: "В наличии", outStock: "Нет в наличии",
                cart: "🛒 Корзина", total: "Итого", order: "Оформить заказ",
                close: "Закрыть", cancel: "Отмена", save: "Сохранить", delete: "Удалить",
                addToCartBtn: "В корзину", sizeLabel: "Размер:", statusLabel: "Статус:", descDefault: "Описание отсутствует",
                cartEmpty: "Корзина пуста", addedAlert: "Товар добавлен в корзину!", orderSuccess: "Спасибо за заказ! Заказ отправлен.",
                fillError: "Заполните название и цену!", addModalTitle: "➕ Добавить товар", photoLabel: "📷 Выбрать фото", stockCheck: "Товар в наличии",
                accessDenied: "Доступ запрещен.", becomeAdmin: "🔑 Активировать права админа", adminActivated: "Права администратора успешно активированы!"
            },
            tj: {
                menu: "Меню", langTitle: "Забон / Language / Язык", profileMenu: "👤 Профил", closeMenu: "✕ Пӯшидан",
                profTitle: "👤 Профили ман", profUserLabel: "Ном ва Telegram ID:", profPhoneLabel: "Рақами телефон:",
                sharePhone: "📱 Рақами телефонро фиристодан", profClose: "Пушидан",
                all: "🔥 Ҳама", boys: "👦 Бачагона", girls: "👧 Духтарона", toys: "🧸 Бозичаҳо", shoes: "👟 Пойафзол",
                add: "Илова кардани мол", inStock: "Дар омбор ҳаст", outStock: "Нест",
                cart: "🛒 Саватча", total: "Ҳамагӣ", order: "Фармоиш додан",
                close: "Пушидан", cancel: "Бекор кардан", save: "Нигоҳ доштан", delete: "Нест кардан",
                addToCartBtn: "Ба саватча", sizeLabel: "Андоза:", statusLabel: "Ҳолат:", descDefault: "Тавсиф мавҷуд нест",
                cartEmpty: "Саватча холӣ аст", addedAlert: "Мол ба саватча илова шуд!", orderSuccess: "Ташаккур барои фармоиш! Фармоиш фиристода шуд.",
                fillError: "Ном ва нархро пур кунед!", addModalTitle: "➕ Илова кардани мол", photoLabel: "📷 Интихоби акс", stockCheck: "Мол дар омбор ҳаст",
                accessDenied: "Дастрасӣ манъ аст.", becomeAdmin: "🔑 Фаъол кардани ҳуқуқи админ", adminActivated: "Ҳуқуқи администратор бо муваффақият фаъол шуд!"
            },
            en: {
                menu: "Menu", langTitle: "Language / Забон / Язык", profileMenu: "👤 Profile", closeMenu: "✕ Close",
                profTitle: "👤 My Profile", profUserLabel: "Username / Name and Telegram ID:", profPhoneLabel: "Phone number:",
                sharePhone: "📱 Share phone number", profClose: "Close",
                all: "🔥 All", boys: "👦 Boys", girls: "Girls", toys: "🧸 Toys", shoes: "👟 Shoes",
                add: "Add product", inStock: "In stock", outStock: "Out of stock",
                cart: "🛒 Cart", total: "Total", order: "Checkout",
                close: "Close", cancel: "Cancel", save: "Save", delete: "Delete",
                addToCartBtn: "Add to cart", sizeLabel: "Size:", statusLabel: "Status:", descDefault: "No description available",
                cartEmpty: "Cart is empty", addedAlert: "Product added to cart!", orderSuccess: "Thank you for your order! Order sent.",
                fillError: "Fill in name and price!", addModalTitle: "➕ Add Product", photoLabel: "📷 Choose Photo", stockCheck: "In stock",
                accessDenied: "Access denied.", becomeAdmin: "🔑 Activate admin rights", adminActivated: "Admin rights successfully activated!"
            }
        };

        const defaultProducts = [
            { id: 1, name: "Костюм детский", category: "boys", size: "110 см", price: 120, salePrice: "", photo: "", desc: "Красивый удобный костюм для ребенка", inStock: true },
            { id: 2, name: "Платье для девочки", category: "girls", size: "100 см", price: 95, salePrice: 80, photo: "", desc: "Нарядное платье", inStock: false }
        ];

        let products = JSON.parse(localStorage.getItem('hellokids_products')) || defaultProducts;
        let cart = JSON.parse(localStorage.getItem('hellokids_cart')) || [];
        let currentFilter = 'all';
        let currentImageBase64 = "";
        let selectedProductForCart = null;

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('menu-title-text').innerText = translations[lang].menu;
            document.getElementById('menu-profile-text').innerText = translations[lang].profileMenu;
            document.getElementById('menu-close-text').innerText = translations[lang].closeMenu;
            document.getElementById('lang-title').innerText = translations[lang].langTitle;
            
            document.getElementById('prof-title').innerText = translations[lang].profTitle;
            document.getElementById('prof-user-label').innerText = translations[lang].profUserLabel;
            document.getElementById('prof-phone-label').innerText = translations[lang].profPhoneLabel;
            document.getElementById('prof-close-btn').innerText = translations[lang].profClose;
            
            const shareBtn = document.getElementById('btn-share-phone');
            if (shareBtn) shareBtn.innerText = translations[lang].sharePhone;

            document.getElementById('cat-all').innerText = translations[lang].all;
            document.getElementById('cat-boys').innerText = translations[lang].boys;
            document.getElementById('cat-girls').innerText = translations[lang].girls;
            document.getElementById('cat-toys').innerText = translations[lang].toys;
            document.getElementById('cat-shoes').innerText = translations[lang].shoes;
            document.getElementById('cart-modal-title').innerText = translations[lang].cart;
            document.getElementById('btn-close-cart').innerText = translations[lang].close;
            document.getElementById('btn-checkout').innerText = translations[lang].order;
            document.getElementById('btn-close-client').innerText = translations[lang].close;
            document.getElementById('btn-add-cart').innerText = translations[lang].addToCartBtn;
            document.getElementById('btn-cancel-modal').innerText = translations[lang].cancel;
            document.getElementById('btn-save-modal').innerText = translations[lang].save;
            document.getElementById('lbl-stock-check').innerText = translations[lang].stockCheck;
            document.getElementById('lbl-photo').innerText = translations[lang].photoLabel;
            
            toggleMenu();
            renderProducts(currentFilter);
        }

        function toggleMenu() {
            document.getElementById('side-menu').classList.toggle('open');
        }

        function renderProducts(filter = 'all') {
            currentFilter = filter;
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            
            const filteredProducts = filter === 'all' ? products : products.filter(p => p.category === filter);

            filteredProducts.forEach(p => {
                let priceHTML = `<span>${p.price} сом.</span>`;
                if (p.salePrice) {
                    priceHTML = `<span class="old-price">${p.price} сом.</span><span class="new-price">${p.salePrice} сом.</span>`;
                }

                let imgHTML = p.photo ? `<img src="${p.photo}" alt="product">` : `📷 Фото`;
                let stockBadge = p.inStock 
                    ? `<span class="status-badge status-in">${translations[currentLang].inStock}</span>` 
                    : `<span class="status-badge status-out">${translations[currentLang].outStock}</span>`;

                list.innerHTML += `
                    <div class="product-card" onclick="openClientOrEdit(${p.id})">
                        ${stockBadge}
                        <div class="product-img">${imgHTML}</div>
                        <div class="product-title">${p.name}</div>
                        <div class="product-info">Размер: ${p.size || 'Универсальный'}</div>
                        <div class="product-price">${priceHTML}</div>
                    </div>
                `;
            });

            if (isAdmin()) {
                list.innerHTML += `
                    <div class="product-card add-card" onclick="openAddModal()">
                        <div class="add-icon">+</div>
                        <div class="add-text">${translations[currentLang].add}</div>
                    </div>
                `;
            }
            
            updateCartCount();
        }

        function openProfileModal() {
            if (document.getElementById('side-menu').classList.contains('open')) {
                toggleMenu();
            }
            
            const user = tg.initDataUnsafe?.user;
            let usernameDisplay = "Не указан";
            if (user) {
                if (user.username) {
                    usernameDisplay = "@" + user.username;
                } else if (user.first_name) {
                    usernameDisplay = user.first_name + (user.last_name ? " " + user.last_name : "");
                }
            } else {
                usernameDisplay = "Тест в браузере";
            }
            
            const userId = user?.id || "Не определен";
            document.getElementById('profile-user-info').innerHTML = `${usernameDisplay} <span style="color:#666; font-weight:normal; font-size:13px;">(ID: ${userId})</span>`;

            const savedPhone = localStorage.getItem('hellokids_user_phone');
            const phoneContainer = document.getElementById('phone-container');
            
            if (savedPhone) {
                phoneContainer.innerHTML = `<b style="color: #2e7d32; font-size: 15px;">${savedPhone}</b>`;
            } else {
                phoneContainer.innerHTML = `<button onclick="requestContact()" id="btn-share-phone" style="width: 100%; padding: 8px; background: #e1f5fe; color: #0288d1; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; margin-top: 4px;">${translations[currentLang].sharePhone}</button>`;
            }
            
            const actionContainer = document.getElementById('admin-action-container');
            actionContainer.innerHTML = '';

            if (Number(userId) === ADMIN_ID || userId === "Не определен") {
                if (!localStorage.getItem('hellokids_is_admin')) {
                    actionContainer.innerHTML = `
                        <button onclick="activateAdmin()" style="width:100%; padding:10px; background:var(--primary-pink); color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; margin-top: 5px;">
                            ${translations[currentLang].becomeAdmin}
                        </button>
                    `;
                } else {
                    actionContainer.innerHTML = `<p style="color: green; font-size: 13px; font-weight: bold; margin-top: 10px;">✔ Вы администратор этого магазина</p>`;
                }
            }

            document.getElementById('profile-modal').style.display = 'flex';
        }

        function requestContact() {
            if (tg.requestContact) {
                tg.requestContact((shared, contact) => {
                    if (shared && contact && contact.phone_number) {
                        let phone = "+" + contact.phone_number;
                        localStorage.setItem('hellokids_user_phone', phone);
                        document.getElementById('phone-container').innerHTML = `<b style="color: #2e7d32; font-size: 15px;">${phone}</b>`;
                    }
                });
            } else {
                let phone = prompt("Введите ваш номер телефона (например, +992918123456):");
                if (phone) {
                    localStorage.setItem('hellokids_user_phone', phone);
                    document.getElementById('phone-container').innerHTML = `<b style="color: #2e7d32; font-size: 15px;">${phone}</b>`;
                }
            }
        }

        function closeProfileModal() {
            document.getElementById('profile-modal').style.display = 'none';
        }

        function activateAdmin() {
            localStorage.setItem('hellokids_is_admin', 'true');
            alert(translations[currentLang].adminActivated);
            closeProfileModal();
            renderProducts(currentFilter);
        }

        function openClientOrEdit(id) {
            const p = products.find(item => item.id === id);
            if (!p) return;
            selectedProductForCart = p;

            let imgHTML = p.photo ? `<img src="${p.photo}" class="client-modal-img">` : '';
            let priceVal = p.salePrice ? p.salePrice : p.price;
            let stockStatusText = p.inStock ? translations[currentLang].inStock : translations[currentLang].outStock;
            
            document.getElementById('c-modal-body').innerHTML = `
                ${imgHTML}
                <h3>${p.name}</h3>
                <p class="desc-text">${p.desc || translations[currentLang].descDefault}</p>
                <div style="font-size: 13px; color: #666; margin-bottom: 5px;">${translations[currentLang].sizeLabel} <b>${p.size}</b></div>
                <div style="font-size: 13px; color: #666; margin-bottom: 10px;">${translations[currentLang].statusLabel} <b>${stockStatusText}</b></div>
                <div style="font-size: 18px; font-weight: bold; color: var(--primary-pink);">${priceVal} сомони</div>
            `;
            
            const btnAdd = document.getElementById('btn-add-cart');
            btnAdd.style.display = p.inStock ? 'block' : 'none';

            document.getElementById('client-modal').style.display = 'flex';
        }

        function closeClientModal() {
            document.getElementById('client-modal').style.display = 'none';
        }

        function openAddModal() {
            if (!isAdmin()) {
                alert(translations[currentLang].accessDenied);
                return;
            }

            document.getElementById('modal-title-text').innerText = translations[currentLang].addModalTitle;
            document.getElementById('m-id').value = '';
            document.getElementById('m-name').value = '';
            document.getElementById('m-category').value = currentFilter === 'all' ? 'boys' : currentFilter;
            document.getElementById('m-size').value = '110 см';
            document.getElementById('m-price').value = '';
            document.getElementById('m-sale').value = '';
            document.getElementById('m-desc').value = '';
            document.getElementById('m-in-stock').checked = true;
            currentImageBase64 = "";
            document.getElementById('m-photo-input').value = '';
            document.getElementById('del-btn').style.display = 'none';
            document.getElementById('modal').style.display = 'flex';
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400;
                    const MAX_HEIGHT = 400;
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    currentImageBase64 = canvas.toDataURL('image/jpeg', 0.6);
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function saveProduct() {
            if (!isAdmin()) {
                alert(translations[currentLang].accessDenied);
                return;
            }

            const id = document.getElementById('m-id').value;
            const name = document.getElementById('m-name').value;
            const category = document.getElementById('m-category').value;
            const size = document.getElementById('m-size').value;
            const price = document.getElementById('m-price').value;
            const salePrice = document.getElementById('m-sale').value;
            const desc = document.getElementById('m-desc').value;
            const inStock = document.getElementById('m-in-stock').checked;

            if (!name || !price) { alert(translations[currentLang].fillError); return; }

            let existingProduct = products.find(item => item.id == id);
            let photoToSave = currentImageBase64 || (existingProduct ? existingProduct.photo : "");

            const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
            products.push({
                id: newId,
                name, category, size,
                price: Number(price),
                salePrice: salePrice ? Number(salePrice) : "",
                desc, inStock,
                photo: photoToSave
            });

            localStorage.setItem('hellokids_products', JSON.stringify(products));
            closeModal();
            renderProducts(currentFilter);
        }

        function deleteProduct() {
            if (!isAdmin()) {
                alert(translations[currentLang].accessDenied);
                return;
            }

            const id = document.getElementById('m-id').value;
            if (!id) return;
            products = products.filter(p => p.id != id);
            localStorage.setItem('hellokids_products', JSON.stringify(products));
            closeModal();
            renderProducts(currentFilter);
        }

        function addToCart() {
            if (!selectedProductForCart) return;
            cart.push(selectedProductForCart);
            localStorage.setItem('hellokids_cart', JSON.stringify(cart));
            updateCartCount();
            closeClientModal();
            alert(translations[currentLang].addedAlert);
        }

        function updateCartCount() {
            document.getElementById('cart-count').innerText = cart.length;
        }

        function openCartModal() {
            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';
            if (cart.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#888;">${translations[currentLang].cartEmpty}</p>`;
                document.getElementById('cart-total-text').innerText = `${translations[currentLang].total}: 0 сомони`;
                document.getElementById('cart-modal').style.display = 'flex';
                return;
            }

            let total = 0;
            cart.forEach((item, index) => {
                let price = item.salePrice ? item.salePrice : item.price;
                total += price;
                container.innerHTML += `
                    <div class="cart-item">
                        <div><b>${item.name}</b><br><small>${translations[currentLang].sizeLabel} ${item.size}</small></div>
                        <div>${price} сом. <button onclick="removeFromCart(${index})" style="background:none;border:none;color:red;cursor:pointer;font-size:16px;">🗑</button></div>
                    </div>
                `;
            });
            document.getElementById('cart-total-text').innerText = `${translations[currentLang].total}: ${total} сомони`;
            document.getElementById('cart-modal').style.display = 'flex';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem('hellokids_cart', JSON.stringify(cart));
            openCartModal();
            updateCartCount();
        }

        function closeCartModal() { document.getElementById('cart-modal').style.display = 'none'; }

        function checkout() {
            if (cart.length === 0) { alert(translations[currentLang].cartEmpty); return; }
            alert(translations[currentLang].orderSuccess);
            cart = [];
            localStorage.removeItem('hellokids_cart');
            updateCartCount();
            closeCartModal();
        }

        function filterCat(category, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts(category);
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderProducts();
        });
    </script>
</body>
</html>
